[build-system]
requires = ["setuptools>=82.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "pyjs"
dynamic = ["version"]
requires-python = ">= 3.14"
authors = [
  {name = "Lex Berezhny", email = "lex@damoti.com"},
]
description = "Python to JavaScript transpiler."
readme = "README.md"
license = "BSD-3-Clause"
dependencies = [
    "sdkmgr>=0.1.0,<0.2",
    "markdown>=3.8",
    "pillow",
    "pydantic>=2,<3",
    "pyyaml>=6.0",
    "pytest",
    "websockets",
    "griffelib>=2,<3",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.scripts]
pyjs = "pyjs.cli:main"

[project.entry-points.pytest11]
pyjs = "pyjs.testing.pytest_plugin"

[project.optional-dependencies]
examples = ["pyjs-examples==0.4.0"]
extras = ["pyjs-extras==0.4.0"]
stripe = ["pyjs-extras[stripe]==0.4.0"]
django = ["django>=6.0,<6.2"]
webgpu = ["wgpu==0.32.0"]

[dependency-groups]
dev = [
    "django>=6.0,<6.2",
    "pyjs-examples==0.4.0",
    "pyjs-extras[stripe]==0.4.0",
    "pytest-xdist==3.8.0",
    "ruff==0.15.22",
    "uvicorn>=0.52,<1",
]

[project.urls]
Homepage = "https://github.com/pyjs/pyjs"
"Release notes" = "https://github.com/pyjs/pyjs/releases"
Source = "https://github.com/pyjs/pyjs"
Tracker = "https://github.com/pyjs/pyjs/issues"
Discord = "https://discord.gg/YktKpQPG7"
X = "https://x.com/pyjsdev"

[tool.ruff]
target-version = "py314"
line-length = 90
extend-exclude = ["tests"]

[tool.ruff.lint]
extend-select = ["B", "I", "TID251", "UP"]
ignore = ["F403", "F405"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"__future__.annotations".msg = "Python 3.14 does not need postponed annotations."

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["build", "dist", "external"]

[tool.uv.sources]
pyjs-examples = {workspace = true}
pyjs-extras = {workspace = true}

[tool.uv.workspace]
members = ["examples", "extras"]

[tool.setuptools.dynamic]
version = {attr = "pyjs.__version__"}

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
include = ["pyjs*"]
namespaces = false

[tool.setuptools.package-data]
"pyjs" = [
    "skills/pyjs/SKILL.md",
    "testing/android_device_runtime.json",
    "testing/android_runtime.json",
]
"pyjs.android" = ["*.json"]
"pyjs.native" = ["UNICODE-LICENSE.txt", "PYTHON-LICENSE.txt"]
"pyjs.docs" = ["*.css", "*.svg"]
"pyjs.scaffolding" = [
    "templates/*.template",
    "templates/app/*.template",
    "templates/app/*/*/*.template",
    "templates/app/tests/*.template",
]
