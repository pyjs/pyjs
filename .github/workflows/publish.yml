name: Build and publish PyJS npm packages

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: npm-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Validate release metadata
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out public source
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Validate versions and release tag
        id: version
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            version=$(python npm/scripts/release.py version --tag "$GITHUB_REF_NAME")
          else
            version=$(python npm/scripts/release.py version)
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build-linux:
    name: Build linux-x64
    needs: preflight
    uses: ./.github/workflows/build-runtime.yml
    with:
      artifact: npm-linux-x64
      platform: Linux
      runner: ubuntu-latest
      target: linux-x64

  build-windows:
    name: Build win32-x64
    needs: build-linux
    uses: ./.github/workflows/build-runtime.yml
    with:
      artifact: npm-win32-x64
      platform: Windows
      runner: windows-latest
      target: win32-x64

  build-macos-arm64:
    name: Build darwin-arm64
    needs: build-windows
    uses: ./.github/workflows/build-runtime.yml
    with:
      artifact: npm-darwin-arm64
      platform: macOS arm64
      runner: macos-15
      target: darwin-arm64

  build-macos-x64:
    name: Build darwin-x64
    needs: build-macos-arm64
    uses: ./.github/workflows/build-runtime.yml
    with:
      artifact: npm-darwin-x64
      platform: macOS x64
      runner: macos-15-intel
      target: darwin-x64

  publish-runtimes:
    name: Publish ${{ matrix.package }}
    if: github.event_name == 'push'
    needs:
      - build-linux
      - build-macos-arm64
      - build-macos-x64
      - build-windows
    strategy:
      fail-fast: false
      matrix:
        include:
          - artifact: npm-linux-x64
            package: "@pyjsdev/cli-linux-x64"
          - artifact: npm-win32-x64
            package: "@pyjsdev/cli-win32-x64"
          - artifact: npm-darwin-arm64
            package: "@pyjsdev/cli-darwin-arm64"
          - artifact: npm-darwin-x64
            package: "@pyjsdev/cli-darwin-x64"
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out public source
        uses: actions/checkout@v6
      - name: Download release artifact
        uses: actions/download-artifact@v6
        with:
          name: ${{ matrix.artifact }}
          path: release-artifact
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Set up Node.js and npm
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Install trusted-publishing npm client
        run: npm install --global "npm@^11.5.1"
      - name: Verify release archive
        id: archive
        shell: bash
        run: |
          archive=$(python npm/scripts/release.py archive \
            release-artifact '${{ matrix.package }}')
          echo "path=$archive" >> "$GITHUB_OUTPUT"
      - name: Publish runtime
        run: npm publish "${{ steps.archive.outputs.path }}" --access public

  publish-launcher:
    name: Publish @pyjsdev/cli
    if: github.event_name == 'push'
    needs:
      - build-linux
      - preflight
      - publish-runtimes
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out public source
        uses: actions/checkout@v6
      - name: Download Linux release artifact
        uses: actions/download-artifact@v6
        with:
          name: npm-linux-x64
          path: release-artifact
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Set up Node.js and npm
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Install trusted-publishing npm client
        run: npm install --global "npm@^11.5.1"
      - name: Verify launcher archive
        id: archive
        shell: bash
        run: |
          archive=$(python npm/scripts/release.py archive \
            release-artifact '@pyjsdev/cli')
          echo "path=$archive" >> "$GITHUB_OUTPUT"
      - name: Publish launcher
        run: npm publish "${{ steps.archive.outputs.path }}" --access public
      - name: Verify published launcher
        shell: bash
        run: |
          project=$(mktemp -d)
          cd "$project"
          npm init --yes >/dev/null
          npm install --ignore-scripts --no-audit --no-fund \
            "@pyjsdev/cli@${{ needs.preflight.outputs.version }}"
          ./node_modules/.bin/pyjs --version
