name: Build and publish PyJS release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      target:
        description: Build all runtimes or one runtime plus the launcher (no publishing)
        default: all
        type: choice
        options:
          - all
          - linux-x64
          - linux-arm64
          - win32-x64
          - darwin-arm64
          - darwin-x64

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Validate release metadata
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out public source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
      - name: Validate versions and release tag
        id: version
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            version=$(python npm/scripts/release.py version --tag "$GITHUB_REF_NAME")
          else
            version=$(python npm/scripts/release.py version)
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  validate:
    name: Validate and build release
    if: github.event_name == 'push' || inputs.target == 'all'
    needs: preflight
    uses: ./.github/workflows/ci.yml
    with:
      retain-packages: true

  build-single:
    name: Build selected runtime and launcher
    if: github.event_name == 'workflow_dispatch' && inputs.target != 'all'
    needs: preflight
    uses: ./.github/workflows/build-runtime.yml
    with:
      artifact: npm-${{ inputs.target }}
      platform: ${{ inputs.target }}
      runner: ${{ fromJSON('{"linux-x64":"ubuntu-24.04","linux-arm64":"ubuntu-24.04-arm","win32-x64":"windows-2025","darwin-arm64":"macos-15","darwin-x64":"macos-15-intel"}')[inputs.target] }}
      target: ${{ inputs.target }}
      include-launcher: true

  validate-native:
    name: Validate native platforms
    if: github.event_name == 'push' || inputs.target == 'all'
    needs: preflight
    uses: ./.github/workflows/native-platforms.yml

  assemble:
    name: Verify and assemble release artifacts
    needs: [preflight, validate, validate-native]
    runs-on: ubuntu-latest
    steps:
      - name: Check out public source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
      - name: Download tested Python distributions
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: python-dist
          path: artifacts/python-dist
      - name: Download tested npm packages
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          pattern: npm-*
          path: artifacts
      - name: Verify archives and assemble GitHub assets
        run: >-
          python npm/scripts/release.py github artifacts release-bundle
          --revision "$GITHUB_SHA"
      - name: Retain release bundle for inspection
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: release-bundle
          path: release-bundle
          if-no-files-found: error
          retention-days: 3

  publish-python:
    name: Publish Python distributions
    if: github.event_name == 'push'
    needs: [preflight, assemble]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out public source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
      - name: Download tested Python distributions
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: python-dist
          path: python-dist
      - name: Verify Python archives
        run: python npm/scripts/release.py verify-python python-dist
      - name: Publish pyjs
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          packages-dir: python-dist/pyjs
      - name: Publish pyjs-examples
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          packages-dir: python-dist/pyjs-examples
      - name: Publish pyjs-extras
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          packages-dir: python-dist/pyjs-extras
      - name: Verify registry installation
        env:
          RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          python -m venv "$RUNNER_TEMP/release-install"
          "$RUNNER_TEMP/release-install/bin/python" -m pip install \
            "pyjs[examples,extras]==$RELEASE_VERSION"
          "$RUNNER_TEMP/release-install/bin/python" -m pip check
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/release-install/bin/pyjs" --version
          "$RUNNER_TEMP/release-install/bin/python" -I -c \
            'import os; from importlib.metadata import version; assert all(version(p) == os.environ["RELEASE_VERSION"] for p in ("pyjs", "pyjs-examples", "pyjs-extras"))'

  publish-runtimes:
    name: Publish ${{ matrix.package }}
    if: github.event_name == 'push'
    needs: [validate, validate-native, assemble]
    strategy:
      fail-fast: false
      matrix:
        include:
          - artifact: npm-linux-x64
            package: "@pyjsdev/cli-linux-x64"
          - artifact: npm-linux-arm64
            package: "@pyjsdev/cli-linux-arm64"
          - artifact: npm-win32-x64
            package: "@pyjsdev/cli-win32-x64"
          - artifact: npm-darwin-arm64
            package: "@pyjsdev/cli-darwin-arm64"
          - artifact: npm-darwin-x64
            package: "@pyjsdev/cli-darwin-x64"
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out public source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Download release artifact
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: ${{ matrix.artifact }}
          path: release-artifact
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
      - name: Set up Node.js and npm
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Install trusted-publishing npm client
        run: npm install --global "npm@^11.5.1"
      - name: Verify release archive
        id: archive
        shell: bash
        run: |
          archive=$(python npm/scripts/release.py archive \
            release-artifact '${{ matrix.package }}')
          echo "path=$archive" >> "$GITHUB_OUTPUT"
      - name: Publish runtime
        run: npm publish "${{ steps.archive.outputs.path }}" --access public

  publish-launcher:
    name: Publish @pyjsdev/cli
    if: github.event_name == 'push'
    needs:
      - validate
      - validate-native
      - preflight
      - publish-runtimes
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out public source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Download Linux release artifact
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: npm-linux-x64
          path: release-artifact
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
      - name: Set up Node.js and npm
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Install trusted-publishing npm client
        run: npm install --global "npm@^11.5.1"
      - name: Verify launcher archive
        id: archive
        shell: bash
        run: |
          archive=$(python npm/scripts/release.py archive \
            release-artifact '@pyjsdev/cli')
          echo "path=$archive" >> "$GITHUB_OUTPUT"
      - name: Publish launcher
        run: npm publish "${{ steps.archive.outputs.path }}" --access public
      - name: Verify published launcher
        shell: bash
        run: |
          project=$(mktemp -d)
          cd "$project"
          npm init --yes >/dev/null
          npm install --ignore-scripts --no-audit --no-fund \
            "@pyjsdev/cli@${{ needs.preflight.outputs.version }}"
          ./node_modules/.bin/pyjs --version

  github-release:
    name: Publish GitHub release
    if: github.event_name == 'push'
    needs: [preflight, assemble, publish-python, publish-launcher]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - name: Download verified release bundle
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: release-bundle
          path: release-bundle
      - name: Verify checksums
        working-directory: release-bundle
        run: sha256sum --check SHA256SUMS
      - name: Create release with tested archives
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
        run: >-
          gh release create "$GITHUB_REF_NAME" release-bundle/*
          --verify-tag --title "PyJS $RELEASE_VERSION"
          --notes-file release-bundle/RELEASE_NOTES.md
