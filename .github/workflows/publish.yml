name: Build and publish PyJS npm packages

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      target:
        description: Build all runtimes or one runtime plus the launcher (no publishing)
        default: all
        type: choice
        options:
          - all
          - linux-x64
          - linux-arm64
          - win32-x64
          - darwin-arm64
          - darwin-x64

permissions:
  contents: read

concurrency:
  group: npm-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Validate release metadata
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out public source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
      - name: Validate versions and release tag
        id: version
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            version=$(python npm/scripts/release.py version --tag "$GITHUB_REF_NAME")
          else
            version=$(python npm/scripts/release.py version)
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  validate:
    name: Validate and build release
    if: github.event_name == 'push' || inputs.target == 'all'
    needs: preflight
    uses: ./.github/workflows/ci.yml
    with:
      retain-packages: true

  build-single:
    name: Build selected runtime and launcher
    if: github.event_name == 'workflow_dispatch' && inputs.target != 'all'
    needs: preflight
    uses: ./.github/workflows/build-runtime.yml
    with:
      artifact: npm-${{ inputs.target }}
      platform: ${{ inputs.target }}
      runner: ${{ fromJSON('{"linux-x64":"ubuntu-24.04","linux-arm64":"ubuntu-24.04-arm","win32-x64":"windows-2025","darwin-arm64":"macos-15","darwin-x64":"macos-15-intel"}')[inputs.target] }}
      target: ${{ inputs.target }}
      include-launcher: true

  validate-native:
    name: Validate native platforms
    if: github.event_name == 'push' || inputs.target == 'all'
    needs: preflight
    uses: ./.github/workflows/native-platforms.yml

  publish-runtimes:
    name: Publish ${{ matrix.package }}
    if: github.event_name == 'push'
    needs: [validate, validate-native]
    strategy:
      fail-fast: false
      matrix:
        include:
          - artifact: npm-linux-x64
            package: "@pyjsdev/cli-linux-x64"
          - artifact: npm-linux-arm64
            package: "@pyjsdev/cli-linux-arm64"
          - artifact: npm-win32-x64
            package: "@pyjsdev/cli-win32-x64"
          - artifact: npm-darwin-arm64
            package: "@pyjsdev/cli-darwin-arm64"
          - artifact: npm-darwin-x64
            package: "@pyjsdev/cli-darwin-x64"
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out public source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Download release artifact
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: ${{ matrix.artifact }}
          path: release-artifact
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
      - name: Set up Node.js and npm
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Install trusted-publishing npm client
        run: npm install --global "npm@^11.5.1"
      - name: Verify release archive
        id: archive
        shell: bash
        run: |
          archive=$(python npm/scripts/release.py archive \
            release-artifact '${{ matrix.package }}')
          echo "path=$archive" >> "$GITHUB_OUTPUT"
      - name: Publish runtime
        run: npm publish "${{ steps.archive.outputs.path }}" --access public

  publish-launcher:
    name: Publish @pyjsdev/cli
    if: github.event_name == 'push'
    needs:
      - validate
      - validate-native
      - preflight
      - publish-runtimes
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out public source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Download Linux release artifact
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: npm-linux-x64
          path: release-artifact
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
      - name: Set up Node.js and npm
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Install trusted-publishing npm client
        run: npm install --global "npm@^11.5.1"
      - name: Verify launcher archive
        id: archive
        shell: bash
        run: |
          archive=$(python npm/scripts/release.py archive \
            release-artifact '@pyjsdev/cli')
          echo "path=$archive" >> "$GITHUB_OUTPUT"
      - name: Publish launcher
        run: npm publish "${{ steps.archive.outputs.path }}" --access public
      - name: Verify published launcher
        shell: bash
        run: |
          project=$(mktemp -d)
          cd "$project"
          npm init --yes >/dev/null
          npm install --ignore-scripts --no-audit --no-fund \
            "@pyjsdev/cli@${{ needs.preflight.outputs.version }}"
          ./node_modules/.bin/pyjs --version
