name: Build portable npm runtime

on:
  workflow_call:
    inputs:
      artifact:
        required: true
        type: string
      platform:
        required: true
        type: string
      runner:
        required: true
        type: string
      target:
        required: true
        type: string
      include-launcher:
        default: false
        type: boolean
      retain-artifact:
        description: Retain release archives; PR smoke tests need only job logs
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  build:
    name: ${{ inputs.platform }} portable runtime
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 120
    steps:
      - name: Check out public source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Validate release metadata
        run: python npm/scripts/release.py version
      - name: Build and install Python distributions
        run: python scripts/check_distributions.py
      - name: Build portable runtime
        run: python npm/scripts/build_runtime.py ${{ inputs.target }}
      - name: Smoke-test portable runtime
        run: >-
          python npm/tests/smoke_test.py ${{ inputs.target }} --skip-build
      - name: Prepare release artifact
        if: inputs.retain-artifact
        shell: bash
        env:
          INCLUDE_LAUNCHER: ${{ inputs.include-launcher }}
        run: |
          args=()
          if [ "$INCLUDE_LAUNCHER" = true ]; then
            args+=(--include-launcher)
          fi
          python npm/scripts/release.py prepare ${{ inputs.target }} \
            npm/dist/packages release-artifacts/${{ inputs.target }} "${args[@]}"
      - name: Upload release artifact
        if: inputs.retain-artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ${{ inputs.artifact }}
          path: release-artifacts/${{ inputs.target }}
          if-no-files-found: error
          retention-days: 3
