name: Build portable npm runtime

on:
  workflow_call:
    inputs:
      artifact:
        required: true
        type: string
      platform:
        required: true
        type: string
      runner:
        required: true
        type: string
      target:
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: ${{ inputs.platform }} portable runtime
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 30
    steps:
      - name: Check out public source
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Validate release metadata
        run: python npm/scripts/release.py version
      - name: Build portable runtime
        run: python npm/scripts/build_runtime.py ${{ inputs.target }}
      - name: Smoke-test portable runtime
        run: >-
          python npm/tests/smoke_test.py ${{ inputs.target }} --skip-build
      - name: Prepare release artifact
        run: >-
          python npm/scripts/release.py prepare ${{ inputs.target }}
          npm/dist/packages release-artifacts/${{ inputs.target }}
      - name: Upload release artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ inputs.artifact }}
          path: release-artifacts/${{ inputs.target }}
          if-no-files-found: error
          retention-days: 14
