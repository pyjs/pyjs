[build-system]
requires = ["setuptools>=82.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "pyjs-examples"
version = "0.4.0"
requires-python = ">=3.14"
authors = [
    {name = "Lex Berezhny", email = "lex@damoti.com"},
]
description = "Official example applications for PyJS."
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
dependencies = [
    "pyjs==0.4.0",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://github.com/pyjs/pyjs"
Source = "https://github.com/pyjs/pyjs"

[project.optional-dependencies]
store = [
    "django>=6.0,<6.2",
    "pydantic>=2,<3",
    "pyjs-extras==0.4.0",
    "uvicorn>=0.52,<1",
]
test = [
    "django>=6.0,<6.2",
    "pydantic>=2,<3",
    "pyjs-extras==0.4.0",
    "pytest>=9.0",
    "uvicorn>=0.52,<1",
]

[project.entry-points."pyjs.templates"]
calculator = "pyjs_examples.calculator"
chat = "pyjs_examples.chat"
components = "pyjs_examples.components"
counter = "pyjs_examples.counter"
notes = "pyjs_examples.notes"
space_invaders = "pyjs_examples.space_invaders"

[tool.setuptools]
include-package-data = false
packages = [
    "pyjs_examples",
    "pyjs_examples.calculator",
    "pyjs_examples.chat",
    "pyjs_examples.components",
    "pyjs_examples.notes",
    "pyjs_examples.space_invaders",
    "pyjs_examples.store",
    "pyjs_examples.homescreen_widget",
]

[tool.setuptools.package-dir]
"pyjs_examples" = "."

[tool.setuptools.package-data]
"pyjs_examples.calculator" = ["README.md", "tests/*.py"]
"pyjs_examples.chat" = ["README.md", "tests/*.py"]
"pyjs_examples.components" = ["README.md", "tests/*.py"]
"pyjs_examples.notes" = [
    "README.md",
    "visual_test.py",
    "tests/*.py",
    "tests/renders/*.png",
]
"pyjs_examples.space_invaders" = [
    "README.md",
    "tests/*.py",
    "tests/renders/*.png",
]
"pyjs_examples.store" = [
    "README.md",
    "fixtures/*.json",
    "visual_test.py",
    "tests/*.py",
]
"pyjs_examples.homescreen_widget" = ["README.md", "res/**/*.xml"]

[tool.pytest.ini_options]
testpaths = [
    "calculator/tests",
    "chat/tests",
    "components/tests",
    "notes/tests",
    "space_invaders/tests",
    "store/tests",
]

[tool.uv.sources]
pyjs = {workspace = true}

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
extend-select = ["B", "I", "UP"]
